<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>미추홀구 민원 분석 파이프라인</title>
    <style>
      :root {
        --bg0: #05070d;
        --bg1: #0a0f1c;
        --panel: rgba(15, 23, 42, 0.72);
        --line: rgba(94, 234, 212, 0.14);
        --line-2: rgba(148, 163, 184, 0.16);
        --ink: #e6edf6;
        --ink-2: #94a3b8;
        --ink-3: #5b6a80;
        --cyan: #22d3ee;
        --teal: #5eead4;
        --amber: #fbbf24;
        --green: #34d399;
        --red: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: Pretendard, "Malgun Gothic", sans-serif;
        background:
          radial-gradient(
            900px 500px at 85% -10%,
            rgba(34, 211, 238, 0.08),
            transparent 60%
          ),
          radial-gradient(
            700px 500px at 0% 110%,
            rgba(94, 234, 212, 0.06),
            transparent 60%
          ),
          linear-gradient(180deg, var(--bg1), var(--bg0));
        background-attachment: fixed;
        color: var(--ink);
        margin: 0;
        padding: 0 clamp(24px, 4.5vw, 88px) 90px;
        min-height: 100vh;
      }
      /* 미세 그리드 배경 */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(148, 163, 184, 0.045) 1px,
            transparent 1px
          );
        background-size: 44px 44px;
        mask-image: radial-gradient(
          80% 60% at 50% 0%,
          #000 40%,
          transparent 100%
        );
      }

      /* ---------- 헤더 ---------- */
      header {
        padding: clamp(32px, 3.6vw, 56px) 0 26px;
        position: relative;
      }
      .overline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--teal);
        font-weight: 700;
        margin-bottom: 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 14px;
        background: rgba(94, 234, 212, 0.05);
      }
      .overline::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 10px var(--teal);
        animation: blink 2.4s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      h1 {
        font-size: clamp(24px, 2.6vw, 38px);
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 10px;
        line-height: 1.25;
        background: linear-gradient(90deg, #f1f5f9, #7dd3fc 85%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .lede {
        color: var(--ink-2);
        font-size: clamp(13px, 1vw, 15px);
        margin: 0;
      }

      /* ---------- 시스템 구조 다이어그램 ---------- */
      /* archify 다이어그램은 .card / .container / .header 등 이 파일과 겹치는
         클래스명을 쓴다. iframe 으로 격리해야 양쪽 CSS·JS가 서로를 깨뜨리지 않고
         다이어그램의 상호작용(경로 추적, 노드 집중, 확대)이 그대로 살아 있다. */
      .diagram-panel {
        margin: 34px 0 26px;
        border: 1px solid var(--line-2);
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }
      .diagram-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line-2);
        background: rgba(94, 234, 212, 0.04);
      }
      .diagram-head .title {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--teal);
        letter-spacing: 0.02em;
      }
      .diagram-head .hint {
        font-size: 11.5px;
        color: var(--ink-3);
        padding: 0;
      }
      .diagram-head .open {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--ink-2);
        text-decoration: none;
        border: 1px solid var(--line-2);
        border-radius: 999px;
        padding: 4px 12px;
      }
      .diagram-head .open:hover {
        color: var(--ink);
        border-color: var(--line);
      }
      #diagram-frame {
        display: block;
        width: 100%;
        height: clamp(360px, 46vh, 620px);
        border: 0;
        background: var(--bg1);
      }

      /* ---------- 파이프라인 트랙 ---------- */
      .track {
        display: flex;
        align-items: stretch;
        gap: 0;
        margin: 34px 0 clamp(44px, 4vw, 64px);
        flex-wrap: wrap;
      }
      .node {
        flex: 1;
        min-width: 240px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line-2);
        border-radius: 14px;
        padding: clamp(16px, 1.4vw, 24px) clamp(18px, 1.6vw, 28px);
        position: relative;
        transition:
          border-color 0.4s,
          box-shadow 0.4s;
      }
      .node-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .led {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ink-3);
        flex: none;
      }
      .node-name {
        font-size: clamp(14px, 1.05vw, 17px);
        font-weight: 700;
      }
      .node-desc {
        font-size: 12.5px;
        color: var(--ink-3);
        margin-bottom: 10px;
      }
      .node-detail {
        font-size: 13px;
        color: var(--ink-2);
        min-height: 19px;
      }
      .node-time {
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 8px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .link {
        width: clamp(30px, 3vw, 60px);
        align-self: center;
        height: 2px;
        flex: none;
        background: var(--line-2);
        position: relative;
        overflow: hidden;
      }
      .link.flow {
        background: rgba(52, 211, 153, 0.35);
      }
      .link.flow::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--green),
          transparent
        );
        animation: stream 1.4s linear infinite;
      }
      @keyframes stream {
        to {
          left: 100%;
        }
      }

      .node.running {
        border-color: rgba(251, 191, 36, 0.5);
        box-shadow: 0 0 30px rgba(251, 191, 36, 0.12);
      }
      .node.running .led {
        background: var(--amber);
        box-shadow: 0 0 12px var(--amber);
        animation: blink 1.1s infinite;
      }
      .node.running .node-detail {
        color: var(--amber);
      }
      .node.done {
        border-color: rgba(52, 211, 153, 0.45);
      }
      .node.done .led {
        background: var(--green);
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.7);
      }
      .node.done .node-detail {
        color: var(--green);
      }
      .node.error {
        border-color: rgba(248, 113, 113, 0.55);
      }
      .node.error .led {
        background: var(--red);
      }

      /* ---------- 결과 피드 (최신이 위) ---------- */
      .feed-label {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        letter-spacing: 0.2em;
        color: var(--ink-3);
        font-weight: 700;
        margin-bottom: 22px;
      }
      .feed-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line-2);
      }

      .stage-section {
        margin-bottom: clamp(40px, 3.6vw, 60px);
        animation: drop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-16px);
        }
      }
      .sec-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
      }
      .sec-badge {
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.14em;
        color: var(--cyan);
        border: 1px solid rgba(34, 211, 238, 0.35);
        border-radius: 6px;
        padding: 5px 10px;
        background: rgba(34, 211, 238, 0.07);
      }
      .sec-head h2 {
        font-size: clamp(16px, 1.25vw, 20px);
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.02em;
      }
      .sec-head .count {
        margin-left: auto;
        font-size: 12px;
        color: var(--ink-3);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr));
        gap: clamp(16px, 1.5vw, 26px);
      }
      .card {
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line-2);
        border-radius: 12px;
        overflow: auto;
      }
      .card.new {
        animation: drop 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .card h3 {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--teal);
        margin: 0;
        padding: 12px 18px;
        letter-spacing: 0.02em;
        border-bottom: 1px solid var(--line-2);
        background: rgba(94, 234, 212, 0.04);
      }
      .card .body {
        padding: 14px 18px 16px;
      }
      .card img {
        display: block;
        width: 100%;
        max-height: 36vh;
        object-fit: contain;
        background: #fff;
      }

      .card table {
        border-collapse: collapse;
        font-size: 12.5px;
        width: 100%;
      }
      .card th {
        text-align: left;
        font-weight: 700;
        color: #7dd3fc;
        padding: 7px 10px;
        border-bottom: 1px solid rgba(125, 211, 252, 0.35);
        white-space: nowrap;
      }
      .card td {
        padding: 6px 10px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        color: var(--ink-2);
        max-width: 420px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .card tr:last-child td {
        border-bottom: 0;
      }
      .card tr:hover td {
        background: rgba(34, 211, 238, 0.05);
        color: var(--ink);
      }
      .card pre {
        font-size: 12.5px;
        color: var(--ink-2);
        white-space: pre-wrap;
        margin: 0;
      }

      .hint {
        color: var(--ink-3);
        font-size: 13.5px;
        padding: 26px 0;
      }
      #updated {
        position: fixed;
        bottom: 14px;
        right: 20px;
        font-size: 11.5px;
        color: var(--ink-3);
        background: rgba(10, 15, 28, 0.85);
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid var(--line-2);
        font-variant-numeric: tabular-nums;
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="overline">인하대학교 × 미추홀구청 관학협력 · LIVE</div>
      <h1>미추홀구 유튜브 여론·민원 분석 파이프라인</h1>
      <p class="lede">댓글 수집 → AI 감성·민원 분류 → 통계 검정</p>
    </header>

    <section class="diagram-panel">
      <div class="diagram-head">
        <span class="title">시스템 구조</span>
        <span class="hint">노드 클릭 · 마우스 오버로 경로 추적 · 실행 중인 단계는 밝게 표시</span>
        <a
          class="open"
          href="docs/pipeline_architecture.diagram.ko.html"
          target="_blank"
          rel="noopener"
          >새 창에서 열기 ↗</a
        >
      </div>
      <iframe
        id="diagram-frame"
        src="docs/pipeline_architecture.diagram.ko.html"
        title="미추홀구 댓글 분석 파이프라인 다이어그램"
      ></iframe>
    </section>

    <div class="track" id="track"></div>

    <div class="feed-label">ANALYSIS FEED — 최신 결과</div>
    <div id="artifacts">
      <div class="hint">
        아직 표시할 결과물이 없습니다. 분석이 시작되면 이곳에 결과가 나타납니다.
      </div>
    </div>
    <div id="updated"></div>

    <script>
      /* ---------- 다이어그램 실시간 하이라이트 ----------
         노트북 단계(key) → 다이어그램 노드(data-node-id) 대응.
         iframe 은 같은 출처(127.0.0.1)에서 서빙될 때만 접근 가능하므로,
         file:// 로 직접 열면 조용히 건너뛴다(다이어그램 자체는 정상 동작). */
      const STAGE_NODES = {
        crawl: ["targets", "platform_apis", "collectors", "raw_store"],
        analysis: ["pipeline", "sentiment", "gemini", "results_store"],
        regression: ["regression", "dashboard"],
      };
      const LIVE_STYLE = `
        [data-node-id][data-live="running"] {
          filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.9));
          animation: live-pulse 1.2s ease-in-out infinite;
        }
        [data-node-id][data-live="done"] {
          filter: drop-shadow(0 0 7px rgba(52, 211, 153, 0.6));
        }
        [data-node-id][data-live="error"] {
          filter: drop-shadow(0 0 10px rgba(248, 113, 113, 0.85));
        }
        @keyframes live-pulse { 50% { opacity: 0.62; } }
      `;
      let diagramStyled = false;
      let diagramSnapshot = null;

      function diagramDoc() {
        try {
          const doc = document.getElementById("diagram-frame").contentDocument;
          if (!doc || !doc.querySelector("[data-node-id]")) return null;
          if (!diagramStyled) {
            const st = doc.createElement("style");
            st.textContent = LIVE_STYLE;
            doc.head.appendChild(st);
            diagramStyled = true;
          }
          return doc;
        } catch (e) {
          return null; // 다른 출처 — file:// 로 연 경우
        }
      }

      function paintDiagram(stages) {
        const snap = JSON.stringify(stages.map((s) => [s.key, s.status]));
        if (snap === diagramSnapshot && diagramStyled) return;
        const doc = diagramDoc();
        if (!doc) return;
        diagramSnapshot = snap;
        doc
          .querySelectorAll("[data-node-id][data-live]")
          .forEach((el) => el.removeAttribute("data-live"));
        stages.forEach((s) => {
          if (s.status === "pending") return;
          (STAGE_NODES[s.key] || []).forEach((id) => {
            doc
              .querySelectorAll(`[data-node-id="${id}"]`)
              .forEach((el) => el.setAttribute("data-live", s.status));
          });
        });
      }

      const secSnapshots = {};
      let trackSnapshot = null;
      let hintCleared = false;
      const seenCards = new Set();

      function cardHTML(stageKey, a, idx) {
        const id = stageKey + ":" + idx;
        const isNew = !seenCards.has(id);
        seenCards.add(id);
        const body =
          a.type === "image"
            ? `<img src="${a.path}" loading="lazy">`
            : `<div class="body">${a.html}</div>`;
        return `<div class="card ${isNew ? "new" : ""}"><h3>${a.title || ""}</h3>${body}</div>`;
      }

      function renderTrack(stages) {
        const snap = JSON.stringify(
          stages.map((s) => [s.status, s.detail, s.elapsed]),
        );
        if (snap === trackSnapshot) return;
        trackSnapshot = snap;
        document.getElementById("track").innerHTML = stages
          .map((s, i) => {
            const node = `<div class="node ${s.status}">
              <div class="node-head"><span class="led"></span>
                <span class="node-name">${s.name.replace(/^\d+\.\s*/, "")}</span></div>
              <div class="node-desc">${s.desc}</div>
              <div class="node-detail">${s.detail || "대기 중"}</div>
              <div class="node-time">${s.elapsed != null ? s.elapsed + "초 소요" : ""}</div>
            </div>`;
            const link =
              i < stages.length - 1
                ? `<div class="link ${s.status === "done" ? "flow" : ""}"></div>`
                : "";
            return node + link;
          })
          .join("");
      }

      function ensureSection(s, idx) {
        const snap = JSON.stringify(s.artifacts);
        if (secSnapshots[s.key] === snap) return;
        const isNewSection = !(s.key in secSnapshots);
        secSnapshots[s.key] = snap;

        const container = document.getElementById("artifacts");
        if (!hintCleared) {
          container.innerHTML = "";
          hintCleared = true;
        }

        let sec = document.getElementById("sec-" + s.key);
        if (!sec) {
          sec = document.createElement("section");
          sec.className = "stage-section";
          sec.id = "sec-" + s.key;
          container.prepend(sec); // ★ 새 단계는 맨 위로
        }
        // 카드도 최신이 먼저 오도록 역순 배치
        const cards = [...s.artifacts]
          .map((a, i) => ({ a, i }))
          .reverse()
          .map(({ a, i }) => cardHTML(s.key, a, i))
          .join("");
        sec.innerHTML = `
          <div class="sec-head">
            <span class="sec-badge">STAGE ${idx + 1}</span>
            <h2>${s.name.replace(/^\d+\.\s*/, "")}</h2>
            <span class="count">산출물 ${s.artifacts.length}건</span>
          </div>
          <div class="grid">${cards}</div>`;
        if (isNewSection) window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function tick() {
        try {
          const r = await fetch("pipeline_status.json?t=" + Date.now());
          const d = await r.json();
          document.getElementById("updated").textContent =
            "최근 갱신 " + d.updated;
          renderTrack(d.stages);
          paintDiagram(d.stages);
          d.stages.forEach((s, i) => {
            if ((s.artifacts || []).length) ensureSection(s, i);
            else {
              const old = document.getElementById("sec-" + s.key);
              if (old) {
                old.remove();
                delete secSnapshots[s.key];
              }
            }
          });
        } catch (e) {
          /* 상태 파일 생성 전 */
        }
      }
      setInterval(tick, 700);
      tick();
    </script>
  </body>
</html>
